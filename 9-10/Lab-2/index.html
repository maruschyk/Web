<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users — пошук, фільтр, сортування, обране</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrap">
      <header>
        <div class="eyebrow">Search · Filter · Sort · Favorites</div>
        <h1>Каталог користувачів</h1>
        <p class="subtitle">
          Завантажте користувачів, а потім шукайте, фільтруйте за містом,
          сортуйте та додавайте їх в обране. Обране зберігається після оновлення
          сторінки.
        </p>
      </header>

      <div class="controls">
        <button id="getUsersBtn" type="button">Get users</button>
        <span class="count" id="count"></span>
      </div>

      <div id="toolbar" class="toolbar hidden">
        <input
          id="searchInput"
          type="text"
          class="field"
          placeholder="Пошук: ім'я, username, email, компанія, місто…"
          autocomplete="off"
        />

        <select id="cityFilter" class="field">
          <option value="all">All cities</option>
        </select>

        <select id="sortBy" class="field">
          <option value="default">Без сортування</option>
          <option value="name">За ім'ям</option>
          <option value="username">За username</option>
          <option value="city">За містом</option>
          <option value="company">За компанією</option>
        </select>

        <label class="fav-toggle">
          <input id="favOnly" type="checkbox" />
          <span>Лише обрані</span>
        </label>
      </div>

      <div id="loader" class="hidden">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading...</span>
      </div>

      <div id="error" class="hidden">Failed to load users</div>

      <div id="emptyState" class="empty hidden">No users found.</div>

      <div id="usersContainer"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
