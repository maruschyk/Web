<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Users — DOM events та HTTP-запити</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrap">
      <header>
        <div class="eyebrow">DOM events · HTTP · async</div>
        <h1>Каталог користувачів</h1>
        <p class="subtitle">
          Натисніть кнопку, щоб завантажити список користувачів із зовнішнього
          API без перезавантаження сторінки.
        </p>
      </header>

      <div class="controls">
        <button id="getUsersBtn" type="button">Get users</button>
        <span class="count" id="count"></span>
      </div>

      <div id="loader" class="hidden">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading...</span>
      </div>

      <div id="error" class="hidden">Failed to load users</div>

      <div id="usersContainer"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
